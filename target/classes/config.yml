############################################################
# +------------------------------------------------------+ #
# |               Blocked Commands Settings              | #
# +------------------------------------------------------+ #
############################################################

# commands
commands:
  vls-amount: 3

  # Tab completion of commands which starts with the following strings will be blocked, but only if it is registered on the server.
  prohibited-tab-complete-commands:
    # fast async world edit
    - "/targetoffset"
    - "/to"

  # Attempt to execute commands which starts with the following strings will be blocked, but only if it is registered on the server.
  prohibited-commands:
    # spigot
    - "/skill"

    # permissions ex
    - "/pex promote"
    - "/pex demote"
    - "/promote"
    - "/demote"

    # world edit
    - "//calc"
    - "//calculate"
    - "//solve"
    - "//eval"
    - "//evaluate"

    # multiverse
    - "/mv ^"
    - "/mvhelp ^"
    - "/mv help ^"

  # Fallback prefixes which also will be checked for at the commands above.
  # Could eg. be if someone types /multiverse-core:mv help ^
  fallback-prefixes:
    - "fastasyncworldedit"
    - "worldedit"
    - "multiverse-core"
    - "permissionsex"

