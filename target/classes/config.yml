# Dette er konfigurationsfil til AntiCrash plugin af Alek05.
#   + Du bruger lige nu version 1.0.0 (BETA) (gratis)
#   + Den bedste Anti Netty Crasher på det danske marked!
#
# Note! Hvis du opdager nogen fejl, så skriv til mig på discord. (kan ses nedenunder)
# Jeg vil med glæde hjælpe, hvis du skriver de nødvendige oplysninger ift. dit problem.
# Vær opmærksom på, at du lige nu bruger en BETA version. Fejl kan forekomme, så bær lige over med det.
#
# Husk også på, at false flags kan forekomme, og det anbefales ikke at banne en bare fordi en
# enkelt violation bliver vist i chatten. (kan opstå ved serverside eller clientside lagspikes).
# Du kan også altid ændre i denne fil, alt er konfigurerbart. Servere er forskellige, og nogle
# servere har andre behov af indstillinger end andre har. Derfor skal du tilpasse det din server.
# Har du svært ved dette, så hjælper jeg gerne!
