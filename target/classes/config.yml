############################################################
# +------------------------------------------------------+ #
# |                 Globale indstillinger                | #
# +------------------------------------------------------+ #
############################################################

# Beskeden en spiller får når vedkommende bliver kicket.
kick-message: "§cDu sender dårlige packets! :-("

# Hvor lang tid der skal gå før gamle violations bliver ryddet.
clear-old-violations-timestamp: 300000 # 5 minutter

# Permission som ignorerer packet checks. Skal slås til før det virker.
bypass-permission-enabled: false
bypass-permission: honey.bypass

# Permission til at få beskeder af spillere der bliver violated.
notify-permission: honey.notify

# packet logger
packet-logger:

  # Skal packet logger være slået til eller ej.
  enabled: false

  # Skal det logges i console også. Som standard bliver der logget i oprettede filer.
  console: false

  # Skal debug mode være slået til eller ej. Brugbart til udvikling og troubleshooting, men for en normal bruger er det fuldstændig unødvendigt.
  # OBS: viser kun i console når den er slået til, ikke i filer, det vil simpelthen ellers fylde dem for meget op.
  debug-mode: false

  # Spillere som packet logger skal ignorere.
  ignored-players:
  # - Alek05

  # Packets som packet logger skal ignorere.
  ignored-packets:
    - "PacketPlayInFlying"
    - "PacketPlayInKeepAlive"

  # Skal packet logger være detaljeret, og vise attributes for hver eneste packet.
  detailed: false

  # Skal gamle logs fjernes ved server start.
  truncate-old-logs: true

############################################################
# +------------------------------------------------------+ #
# |              Item-Analyse Indstillinger              | #
# +------------------------------------------------------+ #
############################################################

# item analysis
item-analysis:

  general:
    # Hvilken strategi skal bruges når et forbudt item bliver fundet. Du kan vælge i mellem følgende:

    # - lenient: Ugyldigheden bliver fjernet, eksempelvis bliver siderne i en bog fjernet hvis den stiger grænsen.
    # - average: Det item bliver konfiskeret, altså det bliver fjernet fra eksistens og er ikke muligt at få igen.
    # - strict: Hele ens inventory bliver ryddet.
    confiscation-strategy: "lenient"

    # Spillere som item-analyse skal ignorere.
    ignored-players:
    # - Alek05

  # Hvor mange bytes må en container (chest/shulker ...) fylde.
  max-container-data: 250000

  # Hvor højt enchant level må et item højest have.
  max-enchantment-level: 256

  # Hvor højt antal må et item stack højest have.
  max-amount: 64

  # Hvor langt navn må et item højest have.
  max-displayname-length: 100

  # Hvor langt må summen af alle længderne på et items lore højest have.
  max-total-lore-length: 2000

  # Hvor mange eksplosioner må et fyrværkeri højest have. I Vanilla Minecraft er det højest muligt at have 17.
  max-firework-explosions: 17

  # Hvor mange banner mønstre må et banner højest have. I Vanilla Minecraft er det højest muligt at have 6.
  max-banner-patterns: 6

  # Må potions ikke have custom potion effects. Kan være bugged i gennem creative.
  disable-custom-potion-effects: false

  # Må items ikke være unbreakable. Kan være bugged i gennem creative.
  disable-unbreakable-items: false

  # Må items ikke have attribute modifiers. Kan være bugged i gennem creative.
  disable-attribute-modifiers: false

  # NBT
  nbt:
    # Hvor mange bytes må et items NBT højest have.
    max-nbt-length: 6000

    # Hvor mange bytes må en nbt string højest være.
    max-nbt-string-length: 275

    # Hvor mange bytes må fyrværkeris NBT højest have. Dette gælder også firework charge.
    max-firework-nbt-length: 1500

    # Hvor mange bytes må en bogs NBT højest have.
    max-book-nbt-length: 5000

    # Hvor mange sider må en bog højest have. I Vanilla Minecraft er det højest muligt at få 50 sider.
    max-book-pages: 50

    # Hvor lang titel må en bog højest have. I Vanilla Minecraft er det højest muligt at få 32 bogstaver.
    max-book-title-length: 32

    # Hvor lang må navnet på en forfatter af en bog højest have. I Vanilla Minecraft er det højest muligt at have 16 bogstaver.
    max-book-author-length: 16

    # Hvor mange NBT bases må et items NBT højest have. (den generelle NBT repræsentation, gælder lister, strings, doubles osv ...)
    max-nbt-bases: 65

    # Hvor meget NBT nesting må et items NBT højest have. (lister oveni listener oveni compounds osv ...)
    max-nbt-nesting: 4

    # Må skulls/heads ikke have ugyldige textures. (behøves kun til op til 1.10.2, da Spigot har patchet det i den version)
    check-illegal-skull-textures: true

############################################################
# +------------------------------------------------------+ #
# |              Packet Check Indstillinger              | #
# +------------------------------------------------------+ #
############################################################

#
# interval er det gældende interval. det er i millisekunder, det vil sige 1000 ms hvert sekund, 60000 ms hvert minut, og så videre
#
# max-per-interval er hvor mange positive tjek der må være i det interval, før vedkommende bliver violated
# hvis max-per-interval ikke er sat, vil man automatisk blive violated når man gør det pågældende tjek (tilsvarende hvis den var på 1)
# derfor giver det ikke mening at have interval, hvis man ikke bruger max-per-interval
#
# vls-amount er hvor mange gange vedkommende må blive violated, før vedkommende bliver kicket. gamle violations bliver
# automatisk ryddet, du kan ændre hvor typisk ovenover. den er normalt på 5 minutter
# hvis vls-amount ikke er sat, vil man automatisk blive kicket når man bliver violated (tilsvarende hvis den var på 1)
#

# alle packets som bliver sendt i et interval, efter at spilleren er blevet violated for det tjek, vil blive blokeret

# |--- netty ---|
netty:
  a:
    enabled: true
    vls-amount: 5

  b:
    enabled: true
    vls-amount: 3

  c:
    enabled: true
    vls-amount: 1

  d:
    enabled: true
    vls-amount: 3

  e:
    enabled: true
    vls-amount: 3
    max-bytes-per-packet: 12500

  f:
    enabled: true
    vls-amount: 1
    threshold: 30000
    decay: 1000
    decay-amount: 6000

  g:
    enabled: true
    vls-amount: 3

  h:
    enabled: true
    vls-amount: 3
    threshold: 500000

  i:
    enabled: true
    vls-amount: 5

# |--- custom payload ---|
custom-payload:
  a:
    enabled: true

  b:
    enabled: true
    max: 10000

  c:
    enabled: true
    max: 6000

  d:
    enabled: true

  e:
    enabled: true
    max: 110

  f:
    enabled: true

    # fælles indstillinger
    interval: 1000
    vls-amount: 3

    # adv cmd
    adv-cmd:
      max-per-interval: 7
      vls-amount: 4

    # auto cmd
    auto-cmd:
      max-per-interval: 7
      vls-amount: 4

    # beacon
    beacon:
      max-per-interval: 6
      vls-amount: 5

    # b edit
    b-edit:
      max-per-interval: 6

    # b open
    b-open:
      max-per-interval: 12

    # b sign
    b-sign:
      max-per-interval: 4

    # brand
    brand:
      max-per-interval: 3
      vls-amount: 5

    # register plugin channel
    register:
      max-per-interval: 4
      vls-amount: 6

    # unregister plugin channel
    unregister:
      max-per-interval: 4
      vls-amount: 6

    # ingen limits på ItemName, PickItem & TrSel, udover den almindelige packet flood længere nede

  g:
    enabled: true

# |--- held item ---|
held-item:
  a:
    enabled: true
    vls-amount: 5

  b:
    enabled: true

# |--- position ---|
velocity:

  new-chunks:
    max-per-interval: 24
    interval: 2800 # 3 sekunder
    vls-amount: 1

  new-unloaded-chunks:
    max-per-interval: 5
    interval: 5000 # 5 sekunder
    vls-amount: 1

  movement:
    # tjekker for block distance i mellem en position packet og den nuværende lokation som serveren kender til
    max-distance: 30
    min-distance: 0.001
    vls-amount: 8

  height:
    max-height: 2048
    min-height: -256
    vls-amount: 1

  yaw:
    max-yaw-distance: 5000
    max-yaw: 25000 # begynder at omregne yaw til en værdi i mellem 0 - 360, så serveren ikke skal døje med store tal
    min-yaw: -25000

# block placement
block-place:

  # tjekker for antal af blocks i mellem spilleren og den lokation spilleren forsøger at sætte en block
  max-block-to-player-distance: 25
  vls-amount: 5

############################################################
# +------------------------------------------------------+ #
# |           Blokerede Kommando Indstillinger           | #
# +------------------------------------------------------+ #
############################################################

# commands
commands:
  vls-amount: 3

  # Tab completion af kommandoer der starter med følgende strings vil blive blokeret, hvis den kommando er registreret på serveren.
  prohibited-tab-complete-commands:
    # fast async world edit
    - "/fargetoffset"
    - "/to"

  # Skrevet kommandoer der starter med følgende strings vil blive blokeret, hvis den kommando er registreret på serveren.
  prohibited-commands:
    # spigot
    - "/skill"

    # permissions ex
    - "/pex promote"
    - "/pex demote"
    - "/promote"
    - "/demote"

    # world edit
    - "//calc"
    - "//calculate"
    - "//solve"
    - "//eval"
    - "//evaluate"

    # multiverse
    - "/mv ^"
    - "/mvhelp ^"
    - "/mv help ^"

  # Fallback prefixes der også vil blive tjekket for ved de ovenstående nægtede kommandoer.
  # Det er eksempelvis hvis man skriver /multiverse-core:mv help ^
  fallback-prefixes:
    - "fastasyncworldedit"
    - "worldedit"
    - "multiverse-core"
    - "permissionsex" # staves PermissionsEX ... :]

