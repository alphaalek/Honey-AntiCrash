
# general
kick-message: "§cDu sender dårlige packets! :-("
clear-old-violations-timestamp: 300000 # 5 minutter

bypass-permission-enabled: false
bypass-permission: honey.bypass

notify-permission: honey.notify

# packet logger
packet-logger:
  enabled: true
  console: true # skal det logges i console også, eller kun i filer

  ignored-players:
    #- Alek05

  ignored-packets:
    - "PacketPlayInFlying"
    - "PacketPlayInKeepAlive"

  detailed: false # viser attributes for hver packet
  truncate-old-logs: true # fjerner gamle logs ved server start

#
# interval er det gældende interval. det er i millisekunder, det vil sige 1000 ms hvert sekund, 60000 ms hvert minut, og så videre
#
# max-per-interval er hvor mange positive tjek der må være i det interval, før vedkommende bliver violated
# hvis max-per-interval ikke er sat, vil man automatisk blive violated når man gør det pågældende tjek (tilsvarende hvis den var på 1)
# derfor giver det ikke mening at have interval, hvis man ikke bruger max-per-interval
#
# vls-amount er hvor mange gange vedkommende må blive violated, før vedkommende bliver kicket. gamle violations bliver
# automatisk ryddet, du kan ændre hvor typisk ovenover. den er normalt på 5 minutter
# hvis vls-amount ikke er sat, vil man automatisk blive kicket når man bliver violated (tilsvarende hvis den var på 1)
#

# alle packets som bliver sendt i et interval, efter at spilleren er blevet violated for det tjek, vil blive blokeret

# netty
netty:
  max-bytes-per-packet: 12500
  block-heavy-compressed: true
  packets-per-second: 500

# nbt
nbt:
  # de forskellige limits på nbt length er målt i længden af bytes
  # bliver tjekket for i alle packets der har med items at gøre
  max-nbt-length: 4000

  max-firework-nbt-length: 1500
  max-firework-charge-nbt-length: 1500

  max-book-nbt-length: 6000
  max-book-pages: 100
  max-book-page-length: 300

  max-nbt-bases: 150
  max-nbt-nesting: 5

  check-illegal-skull-textures: true

# items
items:

  max-chest-data: 250000

  max-enchantment-level: 100
  max-amount: 64

  max-displayname-length: 200
  max-total-lore-length: 2000 # summen af længderne på alle lores af et item

# velocity
velocity:

  new-chunks:
    max-per-interval: 40
    interval: 3000 # 3 sekunder
    vls-amount: 1

  new-unloaded-chunks:
    max-per-interval: 10
    interval: 5000 # 5 sekunder
    vls-amount: 1

  movement:
    # tjekker for block distance i mellem en position packet og den nuværende lokation som serveren kender til
    max-2d-distance: 75
    vls-amount: 8

  height:
    max-height: 2048
    min-height: -256
    vls-amount: 1

  yaw:
    max-yaw: 25000 # begynder at omregne yaw til en værdi i mellem 0 - 360, så serveren ikke skal døje med store tal
    min-yaw: -25000

# custom payload
custom-payload:

  # normalt ikke nødvendigt, da de andre checks vil sørge for alt for store NBT tags,
  # men det kan være en ekstra beskyttelse der sørger for størrelsen på bytebuffers sendt
  # med packet serializeren
  max-bytebuf-size: 10000
  max-bytebuf-capacity: 10000 # for at være sikker på den ikke er compressed

  max-serialized-item-nbt-length: 6000
  max-plugin-channels: 105

  # packet flood for plugin channels
  channels:
    # fælles indstillinger
    interval: 1000
    vls-amount: 3

    # adv cmd
    adv-cmd:
      max-per-interval: 7
      vls-amount: 4

    # auto cmd
    auto-cmd:
      max-per-interval: 7
      vls-amount: 4

    # b edit
    b-edit:
      max-per-interval: 6

    # b open
    b-open:
      max-per-interval: 12

    # b sign
    b-sign:
      max-per-interval: 4

    # beacon
    beacon:
      max-per-interval: 6
      vls-amount: 5

    # register plugin channel
    register:
      max-per-interval: 4
      vls-amount: 6

    unregister:
      max-per-interval: 4
      vls-amount: 6

    # ingen limits på ItemName, PickItem & TrSel, udover den almindelige packet flood længere nede

# block placement
block-place:

  # tjekker for antal af blocks i mellem spilleren og den lokation spilleren forsøger at sætte en block
  max-block-to-player-distance: 25
  vls-amount: 5

# commands
commands:

  vls-amount: 3

  prohibited-tab-complete-commands:
    # fast async world edit
    - "/fargetoffset"
    - "/to"

  # følgende sendte kommandoer der starter med følgende strings vil blive blokeret, hvis den kommando-label findes på serveren
  prohibited-commands:
    # spigot
    - "/skill"
    # permissions ex
    - "/pex promote"
    - "/pex demote"
    - "/promote"
    - "/demote"
    # world edit
    - "//calc"
    - "//calculate"
    - "//solve"
    - "//eval"
    - "//evaluate"
    # multiverse
    - "/mv ^"
    - "/mvhelp ^"
    - "/mv help ^"

  # fallback prefixes der også vil blive tjekket for ved de ovenstående nægtede kommandoer.
  # det er eksempelvis hvis man skriver "//multiverse-core:mvhelp ^"
  fallback-prefixes:
    - "fastasyncworldedit"
    - "worldedit"
    - "multiverse-core"

# flood
packet-flood:

  # common
  common:
    max-per-interval: 180
    interval: 1250
    vls-amount: 1

  # total
  total:
    max-per-interval: 650
    intervaL: 1250
    vls-amount: 1

  # specifics
  specific:
    # fælles indstillinger, hvis du vil have andre skal du ændre det i de forskellige packets
    # packet indstillinger er højere prioritet end fælles indstillinger
    vls-amount: 5
    interval: 1000

    # abilities
    abilities:
      max-per-interval: 25
      vls-amount: 7

    # arm animation
    arm-animation:
      max-per-interval: 50
      interval: 700

    # auto recipe
    auto-recipe:
      max-per-interval: 15
      vls-amount: 4

    # block dig
    block-dig:
      max-per-interval: 35
      interval: 600
      vls-amount: 7

    # block place
    block-place:
      max-per-interval: 35
      interval: 650
      vls-amount: 7

    # chat
    chat:
      max-per-interval: 9
      interval: 500
      vls-amount: 6

    # client command - OBS: ikke en chat command
    client-command:
      max-per-interval: 8
      interval: 500

    # close window
    close-window:
      max-per-interval: 10
      interval: 700
      vls-amount: 4

    # custom payload
    custom-payload:
      max-per-interval: 55 # mere specifikke indstillinger ift packet flood af bestemte plugin channels, under custom-payload-sektionen
      vls-amount: 3

    # enchant item
    enchant-item:
      max-per-interval: 8

    # entity action
    entity-action:
      max-per-interval: 40
      interval: 600

    # flying
    flying:
      max-per-interval: 100
      vls-amount: 10

    # held item slot
    held-item-slot:
      max-per-interval: 25
      interval: 700
      vls-amount: 6

    # keep alive
    keep-alive:
      max-per-interval: 20
      vls-amount: 10

    # look
    look:
      max-per-interval: 40
      interval: 700
      vls-amount: 10

    # position
    position:
      max-per-interval: 40
      interval: 500
      vls-amount: 7

    # set creative slot
    set-creative-slot:
      interval: 850
      max-per-interval: 65

    # settings
    settings:
      max-per-interval: 40
      interval: 400

    # spectate
    spectate:
      max-per-interval: 15

    # steer vehicle
    steer-vehicle:
      max-per-interval: 90

    # tab complete
    tab-complete:
      max-per-interval: 40

    # update sign
    update-sign:
      max-per-interval: 5
      vls-amount: 4

    # use item
    use-item:
      max-per-interval: 35
      interval: 600

    # use entity
    use-entity:
      max-per-interval: 35
      interval: 600

    # window click
    window-click:
      max-per-interval: 65
      interval: 600
      vls-amount: 8







